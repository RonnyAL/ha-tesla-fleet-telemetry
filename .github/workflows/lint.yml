name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          # Pinned deliberately. The action installs the newest ruff when no
          # version is given, so a ruff release can turn CI red on code that
          # did not change — 0.16 widened the default rule set and did
          # exactly that to the upstream project. Bump this on purpose, and
          # fix whatever the new version flags in the same commit.
          version: "0.16.9"
