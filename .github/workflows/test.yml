name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest

  pytest-oldest-supported:
    name: pytest (oldest supported HA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        # Pinned, not "latest": these three versions are coupled.
        # pytest-homeassistant-custom-component pins homeassistant exactly,
        # and each PHACC release supports only the Python that HA supported
        # at the time. 0.13.298 -> homeassistant 2025.12.0 -> Python >= 3.13.
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the oldest Home Assistant we claim to support
        # This is what makes hacs.json's "homeassistant" key a verified claim
        # rather than an assertion. Raising that floor means moving this pin
        # to the PHACC release that pins the matching HA version.
        #
        # Two things to know before changing it. Old pins rot: Home Assistant
        # 2025.3 can no longer be installed at all, because it depends on an
        # aiohttp release that was later yanked. And older PHACC releases
        # carry a stricter verify_cleanup fixture that fails the reauth
        # tests' *teardown* on a daemon thread Home Assistant's own executor
        # starts -- the tests themselves pass. Both were measured; on
        # 2024.12.4 the suite is 386 passed with one such teardown error.
        # If this job goes red for either reason rather than a real test
        # failure, raise the floor -- do not work around it.
        run: |
          pip install "pytest-homeassistant-custom-component==0.13.298" \
                      "cryptography>=42" "protobuf>=4.25,<8" "flatbuffers>=24"
          python -c "from homeassistant.const import __version__ as v; print('HA', v)"
      - name: Run tests
        run: pytest -q

  signal-metadata:
    name: signal metadata is current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # No dependencies: the generator is stdlib-only by design, and --check
      # never touches the network.
      - name: Check the generated metadata matches its inputs
        run: python3 scripts/gen_signal_metadata.py --check
